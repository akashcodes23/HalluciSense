version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hallucisense_postgres
    environment:
      POSTGRES_USER: hallucisense
      POSTGRES_PASSWORD: hallucisense
      POSTGRES_DB: hallucisense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hallucisense -d hallucisense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hallucisense_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hallucisense_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://hallucisense:hallucisense@postgres:5432/hallucisense_db
      - DATABASE_URL_SYNC=postgresql+psycopg://hallucisense:hallucisense@postgres:5432/hallucisense_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-must-be-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
