version: '3.8'

services:
  hallucisense_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  hallucisense_benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 backend/evaluation/benchmark_runner.py
    volumes:
      - ./backend/reports:/app/backend/reports
      - ./backend/evaluation_results:/app/backend/evaluation_results
    depends_on:
      - hallucisense_api
