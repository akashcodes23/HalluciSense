[tool.poetry]
name = "hallucisense"
version = "1.0.0"
description = "A Confidence-Aware Hybrid Multi-Pillar Framework for LLM Hallucination Detection"
authors = ["Lead Research Engineer & Principal Scientist Team <contact@hallucisense.app>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
numpy = "^1.26.4"
scipy = "^1.12.0"
scikit-learn = "^1.4.1"
matplotlib = "^3.8.3"
sentence-transformers = "^2.5.1"
transformers = "^4.38.2"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
black = "^24.2.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
