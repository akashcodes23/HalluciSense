name: HalluciSense Reproducibility & Publication CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Formatting & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black & Flake8
        run: |
          black --check backend/app/ || true
          flake8 backend/app/ --max-line-length=120 --ignore=E203,W503 || true

  test:
    name: Pytest Unit & Engine Verification Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Scientific evaluation modules are intentionally not production
          # runtime dependencies. Install them only in CI for the full suite.
          pip install pandas==2.2.3 matplotlib==3.10.7
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Three Pillars Unit Test Suite
        run: |
          cd backend
          pytest tests/test_three_pillars_complete.py -v

      - name: Run Full Backend Test Suite
        run: |
          cd backend
          pytest tests/ -v

  evaluation:
    name: Master Benchmark & Statistical Verification Pipeline
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas==2.2.3 matplotlib==3.10.7

      - name: Run Master Reproducibility Pipeline
        run: |
          cd backend
          python run_all_experiments.py
          python evaluation/publishable_benchmark.py
          python evaluation/statistical_validation_engine.py

  paper:
    name: Elsevier & IEEE LaTeX Paper Generation
    runs-on: ubuntu-latest
    needs: evaluation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Paper Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pandas==2.2.3 matplotlib==3.10.7

      - name: Generate Paper Packages
        run: |
          cd backend
          python paper/generate_paper.py

  docker:
    name: Multi-Stage Docker Container Build
    runs-on: ubuntu-latest
    needs: evaluation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: hallucisense-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
